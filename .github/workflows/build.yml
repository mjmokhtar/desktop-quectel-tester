name: Build Windows EXE

on:
  push:
    tags: ["v*"]          # jalan saat push tag v1.0.0, v1.1.0, dst
  workflow_dispatch:      # atau klik manual di tab Actions

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write     # untuk membuat Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --onefile --windowed --name quectel-at-tester main.py

      - name: Upload artifact (untuk workflow_dispatch)
        uses: actions/upload-artifact@v4
        with:
          name: quectel-at-tester
          path: dist/quectel-at-tester.exe

      - name: Release (hanya saat push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/quectel-at-tester.exe
          generate_release_notes: true